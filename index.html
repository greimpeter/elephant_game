<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The White Elephant Game</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Language Switch -->
  <div class="language-switch">
    <button data-lang="de">DE</button>
    <button data-lang="it">IT</button>
    <button data-lang="en">EN</button>
  </div>

  <main class="container">
    <h1>🐘 The White Elephant Game 🐘</h1>

    <p class="description" data-i18n="description"></p>

    <div class="info-box">
      <div class="info-item">
        <span class="label">⏰</span>
        <span class="value" data-i18n="time"></span>
      </div>

      <div class="info-item">
        <span class="label">📍</span>
        <span class="value" data-i18n="location"></span>
      </div>
    </div>

    <section class="rules">
      <h2 data-i18n="rules_title"></h2>
      <ul>
        <li data-i18n="rule1"></li>
        <li data-i18n="rule3"></li>
        <li data-i18n="rule2"></li>
      </ul>
    </section>

    <div class="image-wrapper">
      <img src="img.png"/>
    </div>
  </main>

  <footer>
    © 2025 The Wandering Elephant Club. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
